<!-- ADR-060 (founder 4.2): the neutral entry's favicon is the OFFICIAL
     B-Systems mark — the phone's login-screen tab and Add-to-Home-Screen both
     resolve against this route group, and they used to get a generic gradient
     placeholder. Same embedding pattern as (bsystems)/icon.svg, with the PNG
     re-encoded (metadata stripped, downscaled) from
     public/brand/b-systems/logo-mark.png. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64"><image x="14" y="0" width="37" height="64" xlink:href="data:image/png;base64,"/></svg>
